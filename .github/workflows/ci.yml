name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: hyperag
          POSTGRES_PASSWORD: fake-test-only
          POSTGRES_DB: hyperag
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hyperag" --health-interval 2s --health-retries 30
      neo4j:
        image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
        env:
          NEO4J_AUTH: neo4j/fake-test-only
        ports: ["57474:7474"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bootstrap patched Python trust tooling
        run: sh scripts/bootstrap-python-ca.sh python
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build
      - run: node scripts/package-smoke.mjs . "$(npm pack --ignore-scripts --silent)"
      - name: packaged host plugin against an isolated service
        run: bun test test/plugin.test.ts --timeout 30000
      - run: python3 -I eval/public/test_readme_table.py
      - run: python3 -I eval/public/test_benchmark_charts.py
      - run: python3 -I eval/public/benchmark_charts.py --check
      - run: python3 -I scripts/test_install.py
      - run: python3 -I scripts/test_homebrew_formula.py
      - name: recovery survives harness hook termination
        run: |
          python3 -I integrations/hooks/test_recovery.py
          python3 -I integrations/hooks/test_guard.py
          python3 -I integrations/hooks/test_rollback.py
          python3 -I integrations/hooks/test_switch.py
          python3 -I integrations/hooks/test_watchdog_clock.py
          python3 -I integrations/hooks/test_tail_calibration.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-e5small-761b726-bgereranker-280bcc2
      - name: wait for neo4j
        # The root page answers before the Query API accepts queries: wait for a real query, or fail.
        run: |
          for i in $(seq 1 90); do
            # The Query API answers 202 even when the query fails: require the result itself.
            curl -sf -u neo4j:fake-test-only -H 'content-type: application/json' -d '{"statement":"RETURN 1"}' "${HYPERAG_NEO4J_URL:-http://127.0.0.1:57474}/db/neo4j/query/v2" | grep -Eq '"values": *\[ *\[ *1 *\] *\]' && exit 0
            sleep 2
          done
          echo "neo4j did not accept queries" && exit 1
      - run: bun test --timeout 180000
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: hyperag
          POSTGRES_PASSWORD: fake-test-only
          POSTGRES_DB: hyperag
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hyperag" --health-interval 2s --health-retries 30
      neo4j:
        image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
        env:
          NEO4J_AUTH: neo4j/fake-test-only
        ports: ["57474:7474"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16; composite)
        with:
          toolchain: "1.99.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cache/hyperag/models
          key: rust-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release -p hyperag
      - run: cargo test --release -p hyperag
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: isolated harness hook contracts
        run: HYPERAG_BIN=target/release/hyperag python3 crates/hyperag/tests/hooks_install.py
      - name: native hook read fast path
        run: HYPERAG_BIN=target/release/hyperag python3 crates/hyperag/tests/hooks_fast_path.py
      - name: native asynchronous hook queue and latency contracts
        run: HYPERAG_BIN=target/release/hyperag python3 crates/hyperag/tests/hooks_async.py
      - name: live guard recovery handoff and bootstrap RED proofs
        env:
          HYPERAG_BIN: target/release/hyperag
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          original = pathlib.Path("integrations/hooks/native_guard.py").read_text()
          retry_start = original.index("        deadline = time.monotonic() + 1", original.index("def _watchdog"))
          retry_end = original.index("        nonce = secrets.token_hex", retry_start)
          one_shot = "        try:\n            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        except BlockingIOError:\n            return\n"
          mutations = {
              "test_completed_native_status_survives_late_supervisor_wakeup": original.replace(
                  "expired = not exited and time.monotonic() >= deadline", "expired = time.monotonic() >= deadline", 1),
              "test_fast_call_with_separate_process_monotonic_origins_never_trips": original.replace(
                  "shared_started = _shared_time() - age", "shared_started = time.monotonic() - age", 1).replace(
                  "age = _shared_time() - value['started']", "age = time.monotonic() - value['started']", 1),
              "test_bootstrap_retries_watchdog_lock_collision_with_parent_probe": original[:retry_start] + one_shot + original[retry_end:],
              "test_confirmed_recovery_survives_guard_kill_after_marker_unlink": original.replace(
                  "def _trip(config, category, trace=None):\n    directory = Path(config['state_dir'])\n",
                  "def _trip(config, category, trace=None):\n    directory = Path(config['state_dir'])\n    Path(config['active_marker']).unlink(missing_ok=True)\n", 1),
          }
          for test, source in mutations.items():
              assert source != original
              with tempfile.TemporaryDirectory() as temporary:
                  support = pathlib.Path(temporary) / "hooks"
                  shutil.copytree("integrations/hooks", support)
                  (support / "native_guard.py").write_text(source)
                  os.environ["HYPERAG_HOOK_GUARD"] = str(support / "native_guard.py")
                  result = subprocess.run([sys.executable, "crates/hyperag/tests/hooks_live.py", "LiveHooks." + test], capture_output=True, text=True)
                  assert result.returncode != 0 and ("AssertionError" in result.stderr or (test == "test_completed_native_status_survives_late_supervisor_wakeup" and "TimeoutError" in result.stderr)), result.stderr
                  print("RED: " + test)
          PY
      - name: native live guard and detached watchdog
        run: HYPERAG_BIN=target/release/hyperag python3 crates/hyperag/tests/hooks_live.py
      - name: build pinned prior service for rollback identity proof
        run: |
          git fetch origin a42ad2c6e7ad137b6b113bcfb12978fd18ccebf5
          git worktree add --detach /tmp/hyperag-rollback-prior a42ad2c6e7ad137b6b113bcfb12978fd18ccebf5
          cargo build --release --locked -p hyperag --manifest-path /tmp/hyperag-rollback-prior/Cargo.toml --target-dir /tmp/hyperag-rollback-target
      - name: service rollback RED/GREEN across the harness deadline
        env:
          HYPERAG_RECOVERY_CURRENT_BIN: target/release/hyperag
          HYPERAG_RECOVERY_OLD_BIN: /tmp/hyperag-rollback-target/release/hyperag
        run: |
          python3 -I - <<'PY'
          import pathlib, shutil, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              copy = pathlib.Path(temporary) / "hooks"
              shutil.copytree("integrations/hooks", copy)
              helper = copy / "recovery.py"
              helper.write_text(helper.read_text().replace("start_new_session=True", "start_new_session=False"))
              result = subprocess.run([sys.executable, "-I", str(copy / "test_service_recovery.py")], capture_output=True, text=True)
              assert result.returncode != 0 and "prior service not restored after hook timeout" in result.stderr
              print("RED: shared hook process group cannot restore the prior service after termination")
          PY
          python3 -I - <<'PY'
          import ast, pathlib, shutil, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              copy = pathlib.Path(temporary) / "hooks"
              shutil.copytree("integrations/hooks", copy)
              helper = copy / "rollback.py"
              source = helper.read_text()
              function = next(node for node in ast.parse(source).body if isinstance(node, ast.FunctionDef) and node.name == "wait_exited")
              legacy = "def wait_exited(current, timeout=15):\n    deadline = time.monotonic() + timeout\n    while identity(current['pid']) is not None:\n        if time.monotonic() >= deadline: raise TimeoutError('legacy exit deadline')\n        time.sleep(.05)\n"
              lines = source.splitlines(keepends=True)
              lines[function.lineno-1:function.end_lineno] = [legacy]
              helper.write_text("".join(lines))
              for method, category in [
                  ("test_macos_metadata_exit_race_restores_prior_service", "rollback"),
                  ("test_forward_switch_tolerates_late_defunct_metadata", "switch"),
              ]:
                  result = subprocess.run([sys.executable, "-I", str(copy / "test_service_recovery.py"),
                                           "ServiceRecoveryTest." + method], capture_output=True, text=True)
                  assert result.returncode != 0 and category + " failed: ValueError phase=stopping" in result.stderr
                  print("RED: legacy " + category + " identity polling rejects synthetic post-TERM executable metadata")
          PY
          python3 -I integrations/hooks/test_service_recovery.py
      - name: crate package includes its runtime assets
        run: |
          cargo package --list --locked --manifest-path crates/hyperag/Cargo.toml > /tmp/crate-files.txt
          grep -qx 'migrations/0001_init.sql' /tmp/crate-files.txt
          grep -qx 'migrations/0002_settings.sql' /tmp/crate-files.txt
          grep -qx 'migrations/0003_memory_text_limit.sql' /tmp/crate-files.txt
          grep -qx 'LICENSE' /tmp/crate-files.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: wait for neo4j
        # The root page answers before the Query API accepts queries: wait for a real query, or fail.
        run: |
          for i in $(seq 1 90); do
            # The Query API answers 202 even when the query fails: require the result itself.
            curl -sf -u neo4j:fake-test-only -H 'content-type: application/json' -d '{"statement":"RETURN 1"}' "${HYPERAG_NEO4J_URL:-http://127.0.0.1:57474}/db/neo4j/query/v2" | grep -Eq '"values": *\[ *\[ *1 *\] *\]' && exit 0
            sleep 2
          done
          echo "neo4j did not accept queries" && exit 1
      - name: scenarios against the Rust service
        run: |
          HYPERAG_SERVICE_CMD="target/release/hyperag serve" bun eval/scenarios.ts --hyperag http --build rust --systems hyperag --out /tmp/scenarios.json | tee /tmp/out.txt
          grep -q "hyperag-http-rust: 13/13" /tmp/out.txt
      - name: serve-owned lexical writer lifecycle
        run: HYPERAG_SERVICE_CMD="target/release/hyperag serve" bun eval/lexical-writer-smoke.ts
      - name: model switch under concurrent writes
        run: HYPERAG_SERVICE_CMD="target/release/hyperag serve" bun eval/switch-race.ts
      - name: MCP end to end against the Rust service
        run: HYPERAG_SERVICE_CMD="target/release/hyperag serve" bun eval/mcp-smoke.ts
      - name: recent context and harness hooks
        run: HYPERAG_SERVICE_CMD="target/release/hyperag serve" bun eval/hooks-smoke.ts
